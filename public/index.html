<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolHound Label Order Authorization</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --red:#D72F2F;
    --red-dark:#AD2323;
    --red-deep:#7A1616;
    --ink:#201B1A;
    --ink-soft:#5B5352;
    --paper:#FFFFFF;
    --cream:#FAF7F4;
    --line:#E9E1DD;
    --ok:#2E7D4F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Inter',sans-serif;
    font-weight:800;
    letter-spacing:-.01em;
  }
  .topbar{
    background:var(--red);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .logo-img{
    height:38px;
    width:auto;
    display:block;
    filter:brightness(0) invert(1);
  }
  .topbar-right{
    color:#fff;
    font-size:13.5px;
    font-weight:600;
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .hero{
    background:var(--paper);
    color:var(--ink);
    padding:40px 24px 44px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    display:inline-block;
    color:var(--red);
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    margin-bottom:12px;
  }
  .hero h1{
    font-size:clamp(26px,4.6vw,38px);
    margin:0 0 12px;
    line-height:1.08;
    color:var(--ink);
  }
  .hero p{
    max-width:560px;
    margin:0 auto;
    font-size:15px;
    line-height:1.55;
    color:var(--ink-soft);
  }
  .wrap{
    max-width:640px;
    margin:-32px auto 60px;
    padding:0 16px;
  }
  .card{
    background:var(--paper);
    border-radius:16px;
    box-shadow:0 20px 40px -20px rgba(124,33,26,.25), 0 1px 0 var(--line);
    padding:32px 28px 28px;
  }
  /* stepper styled as asset tags */
  .stepper{
    display:flex;
    gap:6px;
    margin-bottom:28px;
  }
  .tag{
    flex:1;
    height:8px;
    border-radius:4px;
    background:var(--line);
    position:relative;
    transition:background .3s ease;
  }
  .tag.done{background:var(--red);}
  .tag.active{background:var(--red);}
  .step-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:4px;
  }
  .step-title{
    font-size:24px;
    margin:0 0 18px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
    color:var(--ink);
  }
  .field .hint{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:5px;
    line-height:1.4;
  }
  .field input[type=text],
  .field input[type=email],
  .field input[type=number],
  .field input[type=date],
  .field textarea,
  .field select{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    background:#fff;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus,
  .field textarea:focus,
  .field select:focus{
    outline:none;
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(207,56,44,.15);
  }
  .field input.err, .field textarea.err, .field select.err{
    border-color:#C0392B;
  }
  .err-msg{
    font-size:12px;
    color:#C0392B;
    margin-top:5px;
    display:none;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:480px){.row2{grid-template-columns:1fr;}}

  .choice-group{display:flex;flex-direction:column;gap:8px;}
  .choice{
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice:hover{border-color:#e5b7b1;}
  .choice.selected{
    border-color:var(--red);
    background:rgba(207,56,44,.06);
  }
  .choice input{margin:0;accent-color:var(--red);}
  .choice .clabel{font-size:14.5px;font-weight:500;}

  .yn{display:flex;gap:10px;}
  .yn .choice{flex:1;justify-content:center;}

  .fileinput{
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:20px;
    text-align:center;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:13.5px;
  }
  .fileinput.has-file{border-color:var(--ok);color:var(--ok);border-style:solid;}
  .fileinput input{display:none;}

  .textlines{display:flex;flex-direction:column;gap:8px;}

  .actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:24px;
    gap:10px;
  }
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    border:none;
    border-radius:9px;
    padding:12px 22px;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease, transform .1s ease;
  }
  button.primary{background:var(--red);color:#fff;}
  button.primary:hover{background:var(--red-dark);}
  button.primary:active{transform:scale(.98);}
  button.ghost{background:transparent;color:var(--ink-soft);}
  button.ghost:hover{color:var(--ink);}
  button:disabled{opacity:.5;cursor:not-allowed;}

  .review-block{margin-bottom:18px;}
  .review-block h3{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--red-deep);
    margin:0 0 10px;
    font-family:'Inter',sans-serif;
    font-weight:700;
  }
  .review-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .review-row:last-child{border-bottom:none;}
  .review-row .k{color:var(--ink-soft);}
  .review-row .v{font-weight:600;text-align:right;max-width:60%;word-break:break-word;}

  .authtext{
    background:var(--cream);
    border-radius:10px;
    padding:16px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink-soft);
    margin-bottom:18px;
  }
  .agree{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin-bottom:18px;
    font-size:13.5px;
  }
  .agree input{margin-top:3px;accent-color:var(--red);}

  .success{
    text-align:center;
    padding:20px 4px 4px;
  }
  .success .check{
    width:56px;height:56px;
    border-radius:50%;
    background:rgba(46,125,79,.12);
    color:var(--ok);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;
  }
  .success .ref{
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:19px;
    letter-spacing:.03em;
    color:var(--red-deep);
    margin:12px 0 4px;
  }

  .foot{
    text-align:center;
    margin-top:22px;
  }
  .foot a{
    font-size:12.5px;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
  }
  .foot a:hover{color:var(--red);}
</style>
</head>

<div class="hero">
  <span class="eyebrow">Custom Label Order</span>
  <h1>Label Order Authorization</h1>
  <p>Please review the specifications below carefully. These labels are custom manufactured based on the information provided and approved by you. Custom label orders are nonreturnable once approved and submitted for production.</p>
</div>

<div class="wrap">
  <div class="card" id="card">
    <!-- rendered by JS -->
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://ayqcteloqdrlemehozzk.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_DpVxcMatuMmcyqF0B774AQ_y8EuFlp1';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>
<script>
(function(){

  const state = {
    step: 0,
    data: {
      companyName:'', contactName:'', contactEmail:'',
      address:'', city:'', stateProvince:'', postalCode:'', country:'Canada',
      logoChoice:'', logoFileName:'', logoFileData:'',
      textLines:['','',''],
      fullColor:'',
      quantity:'', startSeq:'', instructions:'',
      authorizedName:'', approvalDate: new Date().toISOString().slice(0,10)
    },
    orderId:null,
    submitting:false
  };

  const STEPS = ['Customer & Shipping','Label Specifications','Review','Authorization','Done'];

  function el(tag, attrs={}, children=[]){
    const e = document.createElement(tag);
    Object.entries(attrs).forEach(([k,v])=>{
      if(k==='class') e.className=v;
      else if(k==='html') e.innerHTML=v;
      else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k,v);
    });
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c==null) return;
      e.appendChild(typeof c==='string'?document.createTextNode(c):c);
    });
    return e;
  }

  function fieldWrap(labelText, inputEl, hint){
    const wrap = el('div',{class:'field'});
    wrap.appendChild(el('label',{},labelText));
    wrap.appendChild(inputEl);
    const errMsg = el('div',{class:'err-msg'},'Required');
    wrap.appendChild(errMsg);
    if(hint) wrap.appendChild(el('div',{class:'hint'},hint));
    inputEl._errMsg = errMsg;
    return wrap;
  }

  function textInput(value, oninput, type='text', placeholder='Type your answer here'){
    return el('input',{type, value, placeholder, oninput:e=>oninput(e.target.value)});
  }

  function renderStepper(container){
    const s = el('div',{class:'stepper'});
    STEPS.slice(0,4).forEach((label,i)=>{
      s.appendChild(el('div',{class:'tag'+(i<state.step?' done':i===state.step?' active':'')}));
    });
    container.appendChild(s);
  }

  function markErr(inputEl, isErr){
    if(isErr){ inputEl.classList.add('err'); if(inputEl._errMsg) inputEl._errMsg.style.display='block'; }
    else { inputEl.classList.remove('err'); if(inputEl._errMsg) inputEl._errMsg.style.display='none'; }
  }

  function renderStep1(card){
    renderStepper(card);
    card.appendChild(el('div',{class:'step-label'},'Step 1 of 4'));
    card.appendChild(el('h2',{class:'step-title'},'Customer & Shipping Information'));

    const d = state.data;
    const inputs = {};

    inputs.companyName = textInput(d.companyName, v=>d.companyName=v);
    card.appendChild(fieldWrap('Company Name *', inputs.companyName));

    inputs.contactName = textInput(d.contactName, v=>d.contactName=v);
    card.appendChild(fieldWrap('Customer Contact Name *', inputs.contactName));

    inputs.contactEmail = textInput(d.contactEmail, v=>d.contactEmail=v, 'email', 'name@example.com');
    card.appendChild(fieldWrap('Customer Contact Email *', inputs.contactEmail));

    inputs.address = textInput(d.address, v=>d.address=v);
    card.appendChild(fieldWrap('Shipping Address *', inputs.address));

    const row = el('div',{class:'row2'});
    inputs.city = textInput(d.city, v=>d.city=v);
    row.appendChild(fieldWrap('City *', inputs.city));
    inputs.stateProvince = textInput(d.stateProvince, v=>d.stateProvince=v);
    row.appendChild(fieldWrap('State / Province *', inputs.stateProvince));
    card.appendChild(row);

    const row2 = el('div',{class:'row2'});
    inputs.postalCode = textInput(d.postalCode, v=>d.postalCode=v);
    row2.appendChild(fieldWrap('Postal / ZIP Code *', inputs.postalCode));
    inputs.country = textInput(d.country, v=>d.country=v);
    row2.appendChild(fieldWrap('Country *', inputs.country));
    card.appendChild(row2);

    const actions = el('div',{class:'actions'});
    actions.appendChild(el('span'));
    actions.appendChild(el('button',{class:'primary',onclick:()=>{
      const required = ['companyName','contactName','contactEmail','address','city','stateProvince','postalCode','country'];
      let ok = true;
      required.forEach(k=>{
        const bad = !d[k] || !d[k].trim();
        if(k==='contactEmail' && d[k] && !/\S+@\S+\.\S+/.test(d[k])) { markErr(inputs[k],true); ok=false; return; }
        markErr(inputs[k], bad); if(bad) ok=false;
      });
      if(ok){ state.step=1; render(); }
    }},'Continue'));
    card.appendChild(actions);
  }

  function renderStep2(card){
    renderStepper(card);
    card.appendChild(el('div',{class:'step-label'},'Step 2 of 4'));
    card.appendChild(el('h2',{class:'step-title'},'Label Specifications'));

    const d = state.data;
    const wrap = el('div',{class:'field'});
    wrap.appendChild(el('label',{},'Logo / Text on Labels *'));
    const group = el('div',{class:'choice-group'});
    [['Custom Logo','custom_logo'],['Custom Text','custom_text'],['ToolHound Logo','toolhound_logo']].forEach(([label,val])=>{
      const choice = el('div',{class:'choice'+(d.logoChoice===val?' selected':''), onclick:()=>{d.logoChoice=val; render();}},[
        el('input',{type:'radio', name:'logoChoice', checked: d.logoChoice===val?'checked':null}),
        el('span',{class:'clabel'},label)
      ]);
      group.appendChild(choice);
    });
    wrap.appendChild(group);
    const errMsg = el('div',{class:'err-msg'},'Please choose one');
    wrap.appendChild(errMsg);
    wrap._errMsg = errMsg;
    card.appendChild(wrap);

    if(d.logoChoice==='custom_logo'){
      const fw = el('div',{class:'field'});
      fw.appendChild(el('label',{},'Upload customer logo file *'));
      const label = el('label',{class:'fileinput'+(d.logoFileName?' has-file':'')},[
        d.logoFileName ? ('Selected: '+d.logoFileName) : 'Click to upload logo (PNG, JPG, SVG, or PDF)',
        el('input',{type:'file',accept:'.png,.jpg,.jpeg,.svg,.pdf',onchange:e=>{
          const f = e.target.files[0];
          if(!f) return;
          if(f.size > 4*1024*1024){ alert('Please choose a file under 4MB.'); return; }
          const reader = new FileReader();
          reader.onload = ()=>{ d.logoFileData = reader.result; d.logoFileName = f.name; render(); };
          reader.readAsDataURL(f);
        }})
      ]);
      fw.appendChild(label);
      card.appendChild(fw);
    }

    if(d.logoChoice==='custom_text'){
      const fw = el('div',{class:'field'});
      fw.appendChild(el('label',{},'Text Line 1 *'));
      const tl = el('div',{class:'textlines'});
      for(let i=0;i<3;i++){
        tl.appendChild(el('input',{type:'text',maxlength:'10',placeholder:'Line '+(i+1)+' (max 10 characters)',value:d.textLines[i],
          oninput:e=>{d.textLines[i]=e.target.value;}}));
      }
      fw.appendChild(tl);
      fw.appendChild(el('div',{class:'hint'},'Maximum 10 characters each line. Up to three lines allowed.'));
      card.appendChild(fw);
    }

    const ynWrap = el('div',{class:'field'});
    ynWrap.appendChild(el('label',{},'Should the logo be printed in full color? *'));
    const yn = el('div',{class:'yn'});
    ['Yes','No'].forEach(v=>{
      yn.appendChild(el('div',{class:'choice'+(d.fullColor===v?' selected':''), onclick:()=>{d.fullColor=v; render();}},[
        el('input',{type:'radio',name:'fullColor',checked:d.fullColor===v?'checked':null}),
        el('span',{class:'clabel'},v)
      ]));
    });
    ynWrap.appendChild(yn);
    const ynErr = el('div',{class:'err-msg'},'Please choose one');
    ynWrap.appendChild(ynErr);
    ynWrap._errMsg = ynErr;
    card.appendChild(ynWrap);

    const row = el('div',{class:'row2'});
    const qtyInput = textInput(d.quantity, v=>d.quantity=v, 'number','e.g. 500');
    row.appendChild(fieldWrap('Quantity *', qtyInput));
    const seqInput = textInput(d.startSeq, v=>d.startSeq=v, 'number','e.g. 0');
    row.appendChild(fieldWrap('Starting Sequence # *', seqInput, 'Confirm the range: starting sequence plus total quantity = ending number.'));
    card.appendChild(row);

    const instr = el('textarea',{rows:'3',placeholder:'Optional'});
    instr.value = d.instructions;
    instr.addEventListener('input', e=>d.instructions=e.target.value);
    card.appendChild(fieldWrap('Special Instructions', instr));

    const actions = el('div',{class:'actions'});
    actions.appendChild(el('button',{class:'ghost',onclick:()=>{state.step=0; render();}},'Back'));
    actions.appendChild(el('button',{class:'primary',onclick:()=>{
      let ok = true;
      if(!d.logoChoice){ markErr({classList:wrap.classList,_errMsg:errMsg}, true); ok=false; } else { errMsg.style.display='none'; }
      if(d.logoChoice==='custom_logo' && !d.logoFileName) ok=false;
      if(!d.fullColor){ ynErr.style.display='block'; ok=false; } else { ynErr.style.display='none'; }
      markErr(qtyInput, !d.quantity); if(!d.quantity) ok=false;
      markErr(seqInput, d.startSeq===''); if(d.startSeq==='') ok=false;
      if(ok){ state.step=2; render(); }
    }},'Continue'));
    card.appendChild(actions);
  }

  function reviewRow(k,v){
    return el('div',{class:'review-row'},[el('span',{class:'k'},k), el('span',{class:'v'},v||'—')]);
  }

  function renderStep3(card){
    renderStepper(card);
    card.appendChild(el('div',{class:'step-label'},'Step 3 of 4'));
    card.appendChild(el('h2',{class:'step-title'},'Review Your Order'));

    const d = state.data;

    const b1 = el('div',{class:'review-block'});
    b1.appendChild(el('h3',{},'Customer & Shipping'));
    b1.appendChild(reviewRow('Company', d.companyName));
    b1.appendChild(reviewRow('Contact', d.contactName));
    b1.appendChild(reviewRow('Email', d.contactEmail));
    b1.appendChild(reviewRow('Address', `${d.address}, ${d.city}, ${d.stateProvince} ${d.postalCode}, ${d.country}`));
    card.appendChild(b1);

    const b2 = el('div',{class:'review-block'});
    b2.appendChild(el('h3',{},'Label Specifications'));
    const logoLabel = {custom_logo:'Custom Logo', custom_text:'Custom Text', toolhound_logo:'ToolHound Logo'}[d.logoChoice];
    b2.appendChild(reviewRow('Logo / Text', logoLabel));
    if(d.logoChoice==='custom_logo') b2.appendChild(reviewRow('Logo File', d.logoFileName));
    if(d.logoChoice==='custom_text') b2.appendChild(reviewRow('Custom Text', d.textLines.filter(Boolean).join(' / ')));
    b2.appendChild(reviewRow('Full Color', d.fullColor));
    b2.appendChild(reviewRow('Quantity', d.quantity));
    b2.appendChild(reviewRow('Starting Sequence #', d.startSeq));
    if(d.instructions) b2.appendChild(reviewRow('Special Instructions', d.instructions));
    card.appendChild(b2);

    card.appendChild(el('div',{class:'hint',style:'margin-bottom:18px;'},'If everything above looks correct, continue to authorization.'));

    const actions = el('div',{class:'actions'});
    actions.appendChild(el('button',{class:'ghost',onclick:()=>{state.step=1; render();}},'Back'));
    actions.appendChild(el('button',{class:'primary',onclick:()=>{state.step=3; render();}},'Continue to Authorization'));
    card.appendChild(actions);
  }

  function renderStep4(card){
    renderStepper(card);
    card.appendChild(el('div',{class:'step-label'},'Step 4 of 4'));
    card.appendChild(el('h2',{class:'step-title'},'Customer Authorization'));

    const d = state.data;
    card.appendChild(el('div',{class:'authtext'},
      'I confirm that I have reviewed the label specifications provided above and that they are accurate. '+
      'I authorize ToolHound to submit this custom label order for production based on these specifications. '+
      'I understand that these labels are custom manufactured and cannot be returned once the approved order has been submitted for production.'
    ));

    const nameInput = textInput(d.authorizedName, v=>d.authorizedName=v);
    card.appendChild(fieldWrap('Authorized Name *', nameInput));

    const dateInput = el('input',{type:'date', value:d.approvalDate, oninput:e=>d.approvalDate=e.target.value});
    card.appendChild(fieldWrap('Approval Date *', dateInput));

    const agreeWrap = el('div',{class:'agree'});
    const cb = el('input',{type:'checkbox', id:'agreeCb'});
    agreeWrap.appendChild(cb);
    agreeWrap.appendChild(el('label',{for:'agreeCb'},'I have read and agree to the authorization statement above.'));
    card.appendChild(agreeWrap);
    const agreeErr = el('div',{class:'err-msg',style:'margin-top:-10px;margin-bottom:14px;'},'Please check the box to continue');
    card.appendChild(agreeErr);

    const actions = el('div',{class:'actions'});
    actions.appendChild(el('button',{class:'ghost',onclick:()=>{state.step=2; render();}},'Back'));
    const submitBtn = el('button',{class:'primary',onclick: submitOrder},'Submit Order');
    actions.appendChild(submitBtn);
    card.appendChild(actions);

    function submitOrder(){
      let ok = true;
      markErr(nameInput, !d.authorizedName.trim()); if(!d.authorizedName.trim()) ok=false;
      markErr(dateInput, !d.approvalDate); if(!d.approvalDate) ok=false;
      agreeErr.style.display = cb.checked ? 'none' : 'block';
      if(!cb.checked) ok=false;
      if(!ok) return;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting…';
      doSubmit();
    }
  }

  async function doSubmit(){
    const d = state.data;
    const orderRef = 'THL-' + Date.now().toString(36).toUpperCase();
    const row = {
      order_ref: orderRef,
      company_name: d.companyName, contact_name: d.contactName, contact_email: d.contactEmail,
      address: d.address, city: d.city, state_province: d.stateProvince, postal_code: d.postalCode, country: d.country,
      logo_choice: d.logoChoice, logo_file_name: d.logoFileName || null, logo_file_data: d.logoFileData || null,
      text_lines: d.logoChoice === 'custom_text' ? d.textLines : null,
      full_color: d.fullColor,
      quantity: parseInt(d.quantity, 10), start_seq: parseInt(d.startSeq, 10),
      instructions: d.instructions || null,
      authorized_name: d.authorizedName, approval_date: d.approvalDate
    };
    try{
      const { error } = await db.from('label_orders').insert(row);
      if(error){
        console.error('Supabase insert error', error);
        alert('Something went wrong submitting your order. Please try again, or contact ToolHound directly.');
        const btn = document.querySelector('button.primary');
        if(btn){ btn.disabled = false; btn.textContent = 'Submit Order'; }
        return;
      }
    }catch(e){
      console.error('Network error', e);
      alert('Something went wrong submitting your order. Please check your connection and try again.');
      const btn = document.querySelector('button.primary');
      if(btn){ btn.disabled = false; btn.textContent = 'Submit Order'; }
      return;
    }
    state.orderId = orderRef;
    state.step = 4;
    render();
  }

  function renderStep5(card){
    const d = state.data;
    const s = el('div',{class:'success'});
    s.appendChild(el('div',{class:'check',html:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'}));
    s.appendChild(el('h2',{class:'step-title',style:'margin-bottom:6px;'},'Order Submitted'));
    s.appendChild(el('p',{style:'color:var(--ink-soft);font-size:14.5px;max-width:420px;margin:0 auto;'},
      `Your label order has been approved and submitted for production. A confirmation will be sent to ${d.contactEmail}.`));
    s.appendChild(el('div',{class:'ref'}, state.orderId ? ('Reference: '+state.orderId) : ''));
    s.appendChild(el('div',{style:'margin-top:22px;'},
      el('button',{class:'ghost',onclick:()=>{ location.reload(); }},'Submit another order')
    ));
    card.appendChild(s);
  }

  function render(){
    const card = document.getElementById('card');
    card.innerHTML = '';
    if(state.step===0) renderStep1(card);
    else if(state.step===1) renderStep2(card);
    else if(state.step===2) renderStep3(card);
    else if(state.step===3) renderStep4(card);
    else renderStep5(card);
  }

  render();

})();
</script>

</body>
</html>
